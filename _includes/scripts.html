<script>
  if (window.location.hash && (window.location.pathname === '/' || window.location.pathname === '')) {
    setTimeout(function() {
      history.replaceState(null, '', window.location.pathname);
    }, 1);
  }
</script>

{% include analytics.html %}

<script>
  (function() {
    function initPubButtons() {
      document.querySelectorAll('.pub-btn').forEach(function(btn) {
        if (btn.dataset.initialized) return;
        btn.dataset.initialized = 'true';
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          var container = btn.closest('.pub-buttons');
          if (!container) return;
          var content = container.querySelector('.pub-content');
          if (!content) return;

          if (btn.classList.contains('active')) {
            btn.classList.remove('active');
            content.className = 'pub-content hidden';
            content.innerHTML = '';
            return;
          }

          var absBtn = container.querySelector('.pub-abs-btn');
          var bibBtn = container.querySelector('.pub-bib-btn');
          var absData = container.querySelector('.pub-abstract-data');
          var bibData = container.querySelector('.pub-bibtex-data');

          if (absBtn) absBtn.classList.remove('active');
          if (bibBtn) bibBtn.classList.remove('active');

          var text = '';
          var isAbstract = btn.classList.contains('pub-abs-btn');

          if (isAbstract && absData) {
            text = absData.textContent.trim();
            content.innerHTML = '<div class="pub-abstract-body">' + text + '</div><button class="pub-copy-btn">Copy</button>';
            content.className = 'pub-content pub-abstract';
            btn.classList.add('active');
          } else if (!isAbstract && bibData) {
            text = bibData.querySelector('pre') ? bibData.querySelector('pre').textContent : bibData.textContent;
            content.innerHTML = '<pre>' + text + '</pre><button class="pub-copy-btn">Copy</button>';
            content.className = 'pub-content pub-bibtex';
            btn.classList.add('active');
          } else {
            content.className = 'pub-content hidden';
            return;
          }

          var copyBtn = content.querySelector('.pub-copy-btn');
          if (copyBtn) {
            copyBtn.addEventListener('click', function(ev) {
              ev.preventDefault();
              ev.stopPropagation();
              var clone = content.cloneNode(true);
              var cb = clone.querySelector('.pub-copy-btn');
              if (cb) cb.remove();
              var copyText = clone.textContent.trim();
              if (navigator.clipboard) {
                navigator.clipboard.writeText(copyText).then(function() {
                  copyBtn.textContent = 'Copied!';
                  copyBtn.classList.add('copied');
                  setTimeout(function() { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
                });
              }
            });
          }
        });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPubButtons);
    } else {
      initPubButtons();
    }
    var observer = new MutationObserver(function() { initPubButtons(); });
    document.addEventListener('DOMContentLoaded', function() {
      observer.observe(document.body, { childList: true, subtree: true });
    });
    setTimeout(initPubButtons, 1000);
    setTimeout(initPubButtons, 3000);

    // Inject abstracts into homepage highlight paper-boxes
    window.toggleHlAbstract = function(el) {
      var parent = el.parentElement;
      if (parent.classList.contains('collapsed')) {
        parent.classList.remove('collapsed');
        el.innerHTML = '&#9652; Collapse';
      } else {
        var textDiv = parent.querySelector('.hl-abstract-text');
        if (textDiv) textDiv.scrollTop = 0;
        parent.classList.add('collapsed');
        el.innerHTML = '&#9662; Expand';
      }
    };
    (function() {
      var boxes = document.querySelectorAll('.selected-publications .paper-box');
      if (!boxes.length) return;
      fetch('/publications/').then(function(r) { return r.text(); }).then(function(html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var absMap = {};
        doc.querySelectorAll('.publications-list ol.bibliography li').forEach(function(li) {
          var absData = li.querySelector('.pub-abstract-data');
          if (!absData) return;
          var p = li.querySelector('p[data-category]');
          if (!p) return;
          var fullText = p.textContent.trim();
          var titleMatch = fullText.match(/\u201c(.+?)\u201d/);
          if (titleMatch) absMap[titleMatch[1].replace(/[,.\s]+$/, '').trim()] = absData.textContent.trim();
        });
        boxes.forEach(function(box) {
          var titleEl = box.querySelector('.paper-box-text p a');
          if (!titleEl) return;
          var abs = absMap[titleEl.textContent.trim()];
          if (!abs) return;
          var textDiv = box.querySelector('.paper-box-text');
          if (!textDiv) return;
          var absDiv = document.createElement('div');
          absDiv.className = 'hl-abstract collapsed';
          absDiv.innerHTML = '<div class="hl-abstract-text"><span class="hl-abstract-label">Abstract: </span></div><span class="hl-abstract-toggle" role="button" onclick="event.stopPropagation();toggleHlAbstract(this)">&#9662; Expand</span>';
          absDiv.querySelector('.hl-abstract-label').insertAdjacentText('afterend', abs);
          textDiv.appendChild(absDiv);
        });
      }).catch(function() {});
    })();

    var backToTop = document.getElementById('back-to-top');
    if (backToTop) {
      var idleTimer = null;
      window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
          backToTop.classList.add('visible');
          backToTop.classList.remove('idle');
          clearTimeout(idleTimer);
          idleTimer = setTimeout(function() {
            backToTop.classList.add('idle');
          }, 2000);
        } else {
          backToTop.classList.remove('visible');
          backToTop.classList.remove('idle');
          clearTimeout(idleTimer);
        }
      });
      backToTop.addEventListener('mouseenter', function() {
        backToTop.classList.remove('idle');
        clearTimeout(idleTimer);
      });
      backToTop.addEventListener('mouseleave', function() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function() {
          backToTop.classList.add('idle');
        }, 2000);
      });
      backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        var navItems = document.querySelectorAll('.visible-links .masthead__menu-item');
        navItems.forEach(function(i) { i.classList.remove('active'); });
        if (navItems[0]) navItems[0].classList.add('active');
        clearTimeout(idleTimer);
        backToTop.classList.remove('idle');
        idleTimer = setTimeout(function() {
          backToTop.classList.add('idle');
        }, 2000);
      });
    }

    // Scroll fade-in
    var sections = document.querySelectorAll('.page__content h1, .page__content h2');
    sections.forEach(function(s) { s.classList.add('scroll-fade'); });
    var fadeObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        } else {
          entry.target.classList.remove('visible');
        }
      });
    }, { threshold: 0.1 });
    sections.forEach(function(s) { fadeObserver.observe(s); });
    window.registerFadeIn = function(el) {
      el.classList.add('scroll-fade');
      fadeObserver.observe(el);
    };

    // Image lightbox
    (function() {
      var lightbox = document.getElementById('img-lightbox');
      var lbImg = document.getElementById('img-lightbox-img');
      var lbClose = document.querySelector('.img-lightbox-close');
      if (!lightbox || !lbImg) return;
      document.addEventListener('click', function(e) {
        if (e.target.tagName === 'IMG' && e.target.closest('.paper-box-image')) {
          e.preventDefault();
          lbImg.src = e.target.src;
          lightbox.classList.add('open');
        }
      });
      function close() { lightbox.classList.remove('open'); }
      if (lbClose) lbClose.addEventListener('click', close);
      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) close();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') close();
      });
    })();
  })();
</script>

<script>
  function copyEmail(e, email) {
    navigator.clipboard.writeText(email).then(function() {
      var tooltip = document.createElement('div');
      tooltip.className = 'copy-tooltip';
      tooltip.textContent = 'Copied!';
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 8) + 'px';
      document.body.appendChild(tooltip);
      setTimeout(function() { tooltip.remove(); }, 1000);
    });
  }
</script>
